<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POG候補馬リスト</title>
    <meta
      name="description"
      content="毎年のPOG候補馬を年別にまとめるための入口ページです。"
    >
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B4%3C/text%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f2ea;
        --paper: #fffdf8;
        --ink: #252018;
        --muted: #70695d;
        --line: #ddd3c0;
        --accent: #16624f;
        --accent-strong: #0f4739;
        --gold: #b8842f;
        --shadow: 0 18px 50px rgb(60 43 20 / 12%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.7;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgb(22 98 79 / 9%) 0 25%, transparent 25% 100%),
          radial-gradient(circle at 82% 12%, rgb(184 132 47 / 16%), transparent 28rem),
          var(--bg);
      }

      a {
        color: inherit;
      }

      .site {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0 40px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
        gap: 32px;
        align-items: stretch;
        min-height: 56vh;
      }

      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px 0;
      }

      .eyebrow {
        width: fit-content;
        margin: 0 0 18px;
        padding: 5px 12px;
        border: 1px solid rgb(22 98 79 / 24%);
        border-radius: 999px;
        color: var(--accent-strong);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.35rem, 7vw, 5.4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .lead {
        max-width: 42rem;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.16rem);
      }

      .hero-panel {
        position: relative;
        display: grid;
        align-content: end;
        min-height: 440px;
        overflow: hidden;
        border: 1px solid rgb(221 211 192 / 78%);
        border-radius: 8px;
        background:
          linear-gradient(180deg, transparent 0 47%, rgb(37 32 24 / 8%) 47% 48%, transparent 48%),
          linear-gradient(90deg, rgb(255 253 248 / 86%) 0 18%, transparent 18% 100%),
          var(--paper);
        box-shadow: var(--shadow);
      }

      .hero-panel::before {
        content: "";
        position: absolute;
        inset: 54px 34px auto auto;
        width: min(58%, 250px);
        aspect-ratio: 1 / 1;
        border: 2px solid rgb(184 132 47 / 28%);
        border-radius: 50%;
      }

      .hero-panel::after {
        content: "";
        position: absolute;
        right: 26px;
        bottom: 118px;
        width: 72%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgb(22 98 79 / 42%), transparent);
      }

      .panel-content {
        position: relative;
        padding: 28px;
        background: rgb(255 253 248 / 82%);
        border-top: 1px solid rgb(221 211 192 / 82%);
      }

      .panel-title {
        margin: 0;
        color: var(--accent-strong);
        font-size: 1.05rem;
        font-weight: 800;
      }

      .panel-text {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .year-section {
        margin-top: 42px;
      }

      .section-head {
        display: flex;
        gap: 16px;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.35rem, 3vw, 2rem);
        line-height: 1.25;
      }

      .section-note {
        margin: 0;
        color: var(--muted);
        font-size: 0.94rem;
      }

      .year-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .year-card {
        display: grid;
        gap: 18px;
        min-height: 176px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        background: rgb(255 253 248 / 88%);
        box-shadow: 0 10px 28px rgb(60 43 20 / 8%);
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .year-card:hover,
      .year-card:focus-visible {
        border-color: rgb(22 98 79 / 46%);
        box-shadow: 0 16px 36px rgb(60 43 20 / 13%);
        transform: translateY(-2px);
      }

      .year-card:focus-visible {
        outline: 3px solid rgb(22 98 79 / 26%);
        outline-offset: 3px;
      }

      .year-card-top {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 16px;
      }

      .year {
        margin: 0;
        font-size: 2.4rem;
        font-weight: 850;
        line-height: 1;
      }

      .status {
        flex: 0 0 auto;
        padding: 4px 10px;
        border-radius: 999px;
        color: var(--accent-strong);
        background: rgb(22 98 79 / 10%);
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .year-card p {
        margin: 0;
        color: var(--muted);
      }

      .arrow {
        color: var(--accent);
        font-weight: 800;
      }

      footer {
        margin-top: 52px;
        padding-top: 20px;
        border-top: 1px solid rgb(221 211 192 / 72%);
        color: var(--muted);
        font-size: 0.9rem;
      }

      footer p {
        margin: 0;
      }

      @media (max-width: 760px) {
        .site {
          width: min(100% - 28px, 1120px);
          padding: 32px 0 28px;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 18px;
          min-height: 0;
        }

        .hero-copy {
          padding: 18px 0 0;
        }

        .lead {
          margin-top: 18px;
        }

        .hero-panel {
          min-height: 260px;
        }

        .panel-content {
          padding: 22px;
        }

        .section-head {
          display: block;
        }

        .section-note {
          margin-top: 6px;
        }

        .year-section {
          margin-top: 30px;
        }
      }

      @media (max-width: 420px) {
        .year-card {
          min-height: 156px;
          padding: 20px;
        }

        .year-card-top {
          display: block;
        }

        .status {
          display: inline-block;
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="site">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">POG ARCHIVES</p>
          <h1 id="page-title">POG候補馬リスト</h1>
          <p class="lead">
            毎年のペーパーオーナーゲームに向けて、気になる候補馬を年別に整理していくページです。
            写真や情報を見返しやすい形で積み上げていきます。
          </p>
        </div>

        <div class="hero-panel" aria-hidden="true">
          <div class="panel-content">
            <p class="panel-title">Yearly watch list</p>
            <p class="panel-text">
              年ごとの検討材料を、あとから比較しやすい静的ページとして残します。
            </p>
          </div>
        </div>
      </section>

      <section class="year-section" aria-labelledby="year-list-title">
        <div class="section-head">
          <h2 id="year-list-title">年別ページ</h2>
          <p class="section-note">追加した年から順にここへ並べます。</p>
        </div>

        <div class="year-grid">
          <a class="year-card" href="2026/">
            <div class="year-card-top">
              <p class="year">2026</p>
              <span class="status">51頭掲載</span>
            </div>
            <p>
              2026-2027シーズンのPOG候補馬リストへ進む
              <span class="arrow" aria-hidden="true">-&gt;</span>
            </p>
          </a>
        </div>
      </section>
    </main>

    <footer class="site">
      <p>POG候補馬の記録を、年別に少しずつ育てていきます。</p>
    </footer>
  </body>
</html>
